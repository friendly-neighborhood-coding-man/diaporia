<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>DIAPORIA</title>
  <style>
    .ink { stroke: #1c2433; fill: none; }
    .ink-fill { fill: #1c2433; }
    .gate { fill: #0b6b66; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #e3e7ee; }
      .ink-fill { fill: #e3e7ee; }
      .gate { fill: #5cc4bb; }
    }
  </style>
  <circle class="ink" cx="8.5" cy="16" r="5" stroke-width="2.5"/>
  <rect class="gate" x="15" y="5" width="2.5" height="22" rx="1"/>
  <rect class="ink-fill" x="21" y="11" width="10" height="10" rx="1.5"/>
</svg>
